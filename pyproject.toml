[build-system]
# setuptools>=77 for the SPDX-string license + license-files support.
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "currex-schema"
description = "Shared SQLAlchemy models for the wisepay currency-exchange rates DB"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    "SQLAlchemy",
]

# Test dependencies live in requirements-test.txt (pinned, per wisepayru/ym-api#108):
#   pip install -e . -r requirements-test.txt

[project.urls]
Repository = "https://github.com/wisepayru/currex-schema"

[tool.setuptools.packages.find]
where = ["."]
include = ["currex_schema*"]

# the alembic history ships with the package: consumers point script_location at `currex_schema:alembic`, so the
# env, the template and every revision have to be installed beside the model rather than left in the repository
[tool.setuptools.package-data]
currex_schema = ["alembic/*.py", "alembic/*.mako", "alembic/versions/*.py"]

[tool.coverage.run]
# the alembic environment and its revisions are exercised against a real database by the test workflow's
# migration job, not by the unit tests, and the package's coverage gate is about the model
omit = ["currex_schema/alembic/*"]

[tool.setuptools_scm]
