name: tests

# The single source of truth for "did tests pass". Runs standalone on pushes
# and PRs; on a release it runs as the gating job inside release-artifacts.yml
# (workflow_call), so there's no standalone `release` trigger here -- that would
# just duplicate the same run.
on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call: {}

# Least privilege: this workflow only lints + tests, it never writes to the repo
# or a release. The release workflow that calls this one declares its own
# contents: write where it actually needs it.
permissions:
  contents: read

jobs:
  test:
    # Push always runs. PRs run only when the author is an org
    # member/maintainer, so a fork's first push does not run unreviewed code
    # against this repository's workflow. workflow_call passes through: the
    # calling release workflow only fires on trusted events.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # Full history + tags so setuptools-scm can derive the version.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"

      - name: Install package and test dependencies
        run: pip install -e . -r requirements-test.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest --cov-fail-under=100

  migration:
    # The history in currex_schema/alembic is what every consumer of this
    # package applies, so it is proven here against the Postgres version the
    # cluster runs: the revisions build the schema from empty, and `alembic
    # check` then finds no difference between the model and what they built. A
    # model change without a revision fails this job, which is the whole point.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PIP_NO_CACHE_DIR: "1"
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: postgres
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"

      - name: Install the package and alembic
        run: pip install -e . alembic==1.20.0 psycopg2-binary==2.9.13

      - name: Prepare the database as the cluster has it
        # Every object the history creates belongs to wisepay_owner, because that
        # is the role the tenant's grants declare default privileges for. A fresh
        # database has no such role, and alembic's SET ROLE would fail on the
        # first statement. The grant on public is needed too: since PostgreSQL 15
        # that schema belongs to pg_database_owner and a member role holds nothing
        # on it, so CREATE TABLE public.alembic_version is refused without it. The
        # tenant's grants.sql makes the same grant for the same reason.
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE wisepay_owner NOLOGIN" \
            -c "GRANT wisepay_owner TO postgres" \
            -c "GRANT CREATE ON SCHEMA public TO wisepay_owner"

      - name: Build the schema from the history
        run: alembic -c alembic.ini upgrade head

      - name: The model and the schema agree
        run: alembic -c alembic.ini check
